name: Application CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  schema:
    name: Database schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stocksignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply CLI migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for file in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d stocksignal -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Re-apply reviewed schema.sql to prove idempotency
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d stocksignal -v ON_ERROR_STOP=1 -f supabase/schema.sql

